</head>
<body class="{{THEME_CLASS}}">

<!-- ============================================================
     Toolbar
     ============================================================ -->
<div id="toolbar">
  <div id="toolbar-center">

    <!-- TOC-Button (nur sichtbar wenn Überschriften vorhanden) -->
    <button class="toolbar-btn" id="btn-toc"
            title="Inhaltsverzeichnis" style="display:none">&#9776;</button>

    <div class="toolbar-separator" id="sep-toc" style="display:none"></div>

    <!-- Datei öffnen (nativer Dialog, Strg+O) -->
    <button class="toolbar-btn" id="btn-open"
            title="Datei öffnen (Strg+O)">&#128194;</button>

    <div class="toolbar-separator"></div>

    <!-- Hochformat / Querformat -->
    <button class="toolbar-btn" id="btn-layout"
            title="Hochformat / Querformat umschalten">&#9647;</button>

    <div class="toolbar-separator"></div>

    <!-- Zoom -->
    <button class="toolbar-btn" id="btn-zoom-out"
            title="Schrift verkleinern (Strg+-)">&#8854;</button>
    <span id="zoom-label">100%</span>
    <button class="toolbar-btn" id="btn-zoom-in"
            title="Schrift vergrößern (Strg++)">&#8853;</button>

    <div class="toolbar-separator"></div>

    <!-- Suche -->
    <button class="toolbar-btn" id="btn-search"
            title="Suchen (Strg+F)">&#128269;</button>

    <div class="toolbar-separator"></div>

    <!-- Theme-Wechsel -->
    <button class="toolbar-btn" id="btn-theme"
            title="Dunkelmodus einschalten">&#9790;</button>

    <div class="toolbar-separator"></div>

    <!-- Vollbild -->
    <button class="toolbar-btn" id="btn-fullscreen"
            title="Vollbild (F11)">&#9634;</button>

  </div>
  <!-- Schließen-Button rechts -->
  <button class="toolbar-btn" id="btn-close"
          title="Schließen">&#10005;</button>
</div>

<!-- ============================================================
     Suchleiste (unter Toolbar)
     ============================================================ -->
<div id="search-bar">
  <input type="text" id="search-input" placeholder="Suchen..."
         autocomplete="off">
  <span id="search-count"></span>
  <button class="toolbar-btn" id="search-prev" title="Vorheriges (Umschalt+Enter)">&#8593;</button>
  <button class="toolbar-btn" id="search-next" title="N&#228;chstes (Enter)">&#8595;</button>
  <button class="toolbar-btn" id="search-close" title="Suche schlie&#223;en (Esc)">&#10005;</button>
</div>

<!-- ============================================================
     TOC-Seitenleiste
     ============================================================ -->
<div id="toc-sidebar">
  <div id="toc-header">
    <span>Inhalt</span>
    <button class="toolbar-btn" id="toc-close" title="Schlie&#223;en"
            style="min-width:24px;height:24px;font-size:13px;">&#10005;</button>
  </div>
  <ul id="toc-list"></ul>
</div>

<!-- ============================================================
     Haupt-Inhaltsbereich
     ============================================================ -->
<div id="main">

  <!-- Drop-Zone (wird ausgeblendet wenn Go direkt Inhalt via SetHtml einbettet) -->
  <div id="drop-zone" style="display:{{DROP_ZONE_DISPLAY}}">
    <div class="drop-icon">&#128218;</div>
    <div class="drop-title">Datei hier ablegen</div>
    <div class="drop-subtitle">.md &middot; .epub &middot; .txt &middot; .fb2 und weitere</div>
    <div class="drop-error" id="drop-error"></div>
  </div>

  <!-- Inhaltsbereich: Go bettet das gerenderte HTML direkt in #content ein.
       Hier KEINE Platzhalter nennen: der Replacer würde sie auch im Kommentar
       ersetzen, ein Kommentar-Ende im Inhalt beendet dann diesen Kommentar
       vorzeitig (Bug #013). -->
  <div id="content-wrapper" style="display:{{CONTENT_WRAPPER_DISPLAY}}">
    <div id="content">{{CONTENT_HTML}}</div>
  </div>

</div>
